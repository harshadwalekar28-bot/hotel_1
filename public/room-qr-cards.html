<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Haven - Physical Room QR Code Cards (Printable)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: #1c1917;
      color: #292524;
      padding: 24px;
    }
    .no-print-bar {
      max-width: 1000px;
      margin: 0 auto 30px auto;
      background: #292524;
      border: 1px solid #44403c;
      border-radius: 16px;
      padding: 20px 24px;
      color: #fafaf9;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .no-print-bar h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 700;
      color: #fef08a;
      letter-spacing: 0.05em;
    }
    .no-print-bar p {
      font-size: 13px;
      color: #d6d3d1;
      margin-top: 4px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: #fbbf24;
      color: #1c1917;
    }
    .btn-primary:hover {
      background: #f59e0b;
    }
    .btn-secondary {
      background: #44403c;
      color: #fafaf9;
    }
    .btn-secondary:hover {
      background: #57534e;
    }
    .cards-container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 32px;
    }
    
    /* Physical Acrylic Tent Card (Designed for 4x6" or 5x7" stands) */
    .room-card {
      background: #ffffff;
      border-radius: 20px;
      border: 2px solid #e7e5e4;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      padding: 32px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-col;
      flex-direction: column;
      justify-content: space-between;
      page-break-inside: avoid;
    }
    .card-top-pattern {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #d97706, #fbbf24, #d97706);
    }
    .hotel-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #1c1917;
      margin-bottom: 2px;
    }
    .hotel-sub {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #78716c;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .room-badge {
      display: inline-block;
      margin: 0 auto 16px auto;
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 6px 18px;
      border-radius: 9999px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .instruction {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 700;
      color: #1c1917;
      line-height: 1.25;
      margin-bottom: 6px;
    }
    .instruction-sub {
      font-size: 12px;
      color: #57534e;
      margin-bottom: 18px;
    }
    .qr-frame {
      background: #fafaf9;
      border: 2px dashed #d6d3d1;
      border-radius: 16px;
      padding: 16px;
      display: inline-block;
      margin: 0 auto 18px auto;
    }
    .qr-frame canvas {
      display: block;
      margin: 0 auto;
      border-radius: 8px;
    }
    .amenities-strip {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: 11px;
      font-weight: 600;
      color: #44403c;
      margin-bottom: 18px;
      padding: 8px 12px;
      background: #f5f5f4;
      border-radius: 8px;
    }
    .amenities-strip span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .wifi-box {
      background: #1c1917;
      color: #fafaf9;
      border-radius: 12px;
      padding: 12px 16px;
      text-align: left;
    }
    .wifi-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #fbbf24;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .wifi-details {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-family: monospace;
      color: #e7e5e4;
    }
    .wifi-details strong {
      color: #ffffff;
    }

    /* Print media styles */
    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .no-print-bar {
        display: none !important;
      }
      .cards-container {
        display: block;
        max-width: 100%;
      }
      .room-card {
        box-shadow: none;
        border: 1px solid #78716c;
        margin-bottom: 40px;
        page-break-after: always;
        width: 100%;
        max-width: 480px;
        margin: 0 auto 60px auto;
      }
    }
  </style>
</head>
<body>

  <!-- Controls Bar (Hidden during printing) -->
  <div class="no-print-bar">
    <div>
      <h1>Aura Haven Physical Room QR Code Cards</h1>
      <p>Print these acrylic stand tent cards and place one physically on the nightstand or desk in each suite.</p>
    </div>
    <div class="btn-group">
      <a href="/Aura_Haven_Room_QR_Cards.pdf" download="Aura_Haven_Room_QR_Cards.pdf" class="btn btn-secondary" style="text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">📥 Download PDF Document</a>
      <button class="btn btn-secondary" onclick="generateCustomRoom()">+ Add Custom Room</button>
      <button class="btn btn-primary" onclick="window.print()">🖨️ Print Room Cards</button>
    </div>
  </div>

  <!-- Cards Grid -->
  <div class="cards-container" id="cards-container">
    <!-- Populated by JavaScript with genuine scannable QR codes -->
  </div>

  <script>
    // Host URL for the applet
    const baseUrl = window.location.origin;

    const initialRooms = [
      { num: '402', title: 'Deluxe Ocean View Suite', floor: 'Floor 4' },
      { num: '305', title: 'Executive Garden Balcony', floor: 'Floor 3' },
      { num: '210', title: 'Signature King Room', floor: 'Floor 2' },
      { num: '314', title: 'Ocean View Deluxe Room', floor: 'Floor 3' },
      { num: '502', title: 'Executive Balcony Suite', floor: 'Floor 5' },
      { num: '601', title: 'Penthouse Presidential Villa', floor: 'Floor 6' },
      { num: '108', title: 'Lagoon Beachfront Suite', floor: 'Floor 1' }
    ];

    function renderCard(room) {
      // Direct URL scanned by phone camera
      const targetUrl = `${baseUrl}/?room=${room.num}`;

      const card = document.createElement('div');
      card.className = 'room-card';
      card.id = `card-${room.num}`;

      card.innerHTML = `
        <div class="card-top-pattern"></div>
        <div>
          <div class="hotel-name">Aura Haven</div>
          <div class="hotel-sub">Luxury Resort & Spa · ${room.floor}</div>
          
          <div class="room-badge">SUITE ${room.num} · ${room.title}</div>
          
          <h2 class="instruction">Scan with Your Camera</h2>
          <p class="instruction-sub">Point your smartphone camera at the code below to open your suite companion</p>
          
          <div class="qr-frame">
            <canvas id="qr-${room.num}"></canvas>
          </div>
          
          <div class="amenities-strip">
            <span>📶 Fast WiFi</span>
            <span>·</span>
            <span>🍽️ In-Room Dining</span>
            <span>·</span>
            <span>🛏️ Fresh Linens</span>
            <span>·</span>
            <span>🛎️ Concierge</span>
          </div>
        </div>

        <div class="wifi-box">
          <div class="wifi-title">Complimentary In-Room High-Speed WiFi</div>
          <div class="wifi-details">
            <span>Network: <strong>AuraHaven_Guest_Ultra5G</strong></span>
            <span>Password: <strong>AuraGuest2026</strong></span>
          </div>
        </div>
      `;

      document.getElementById('cards-container').appendChild(card);

      // Render crisp, scannable QR code canvas
      setTimeout(() => {
        const canvas = document.getElementById(`qr-${room.num}`);
        if (canvas && window.QRCode) {
          QRCode.toCanvas(canvas, targetUrl, {
            width: 180,
            margin: 1,
            color: {
              dark: '#1c1917',
              light: '#ffffff'
            }
          }, function (error) {
            if (error) console.error(error);
          });
        }
      }, 50);
    }

    // Render all initial suites
    initialRooms.forEach(renderCard);

    // Function to add any custom room
    function generateCustomRoom() {
      const roomNum = prompt('Enter Room Number (e.g. 204, 501, 702):', '204');
      if (roomNum && roomNum.trim()) {
        const num = roomNum.trim();
        const customRoom = {
          num: num,
          title: `Suite ${num}`,
          floor: `Floor ${num[0] || '1'}`
        };
        renderCard(customRoom);
        // Scroll to new card
        setTimeout(() => {
          document.getElementById(`card-${num}`)?.scrollIntoView({ behavior: 'smooth' });
        }, 100);
      }
    }
  </script>
</body>
</html>
